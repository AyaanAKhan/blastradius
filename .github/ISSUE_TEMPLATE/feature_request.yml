name: Feature request
description: Propose an evidence source or workflow improvement.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Engineering problem
      description: What review decision is difficult today?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Proposed evidence
      description: What observable signal would improve the decision?
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation approach
      description: How could the project test whether this improves review targeting?
    validations:
      required: true

name: Bug report
description: Report reproducible incorrect or unexpected behavior.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to provide a reproducible report.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a small diff, repository map, or exact sequence of actions. Remove secrets and proprietary source.
      render: shell
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, and Node.js version when relevant.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed credentials, secrets, and proprietary source from this report.
          required: true
